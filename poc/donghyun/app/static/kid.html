<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff6e9">
<title>챙겼지 · 가방 싸기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Color+Emoji&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/kid.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a class="back" href="/" aria-label="부모 화면으로">‹ 부모</a>
    <span class="brand">챙겼지</span>
    <button class="speak" id="speakAll" aria-label="읽어 주기">🔈</button>
  </header>

  <!-- C-1 펼치기 -->
  <section class="screen" id="s-lay">
    <div class="head">
      <h1 id="layTitle">가방 싸기</h1>
      <p class="lead"><b id="layCount">0</b>개를 펼쳐 놓자</p>
    </div>
    <div class="grid" id="layGrid"></div>
    <p class="tip">카드를 누르면 이름을 읽어 줘요</p>
    <div class="dock">
      <button class="cta" id="layDone">다 펼쳤어! <span class="cam">📷</span></button>
      <button class="sub" id="noPhoto">사진 없이 하나씩 할래</button>
      <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    </div>
  </section>

  <!-- 사진 확인 중 -->
  <section class="screen" id="s-scan">
    <div class="scan">
      <div class="polaroid"><img id="scanImg" alt="펼쳐 놓은 준비물 사진"><i class="beam"></i></div>
      <p class="lead">사진을 보고 있어요…</p>
    </div>
  </section>

  <!-- C-2 하나씩 -->
  <section class="screen" id="s-one">
    <div class="head">
      <h1 id="oneTitle">하나만 더 보자</h1>
      <p class="lead" id="oneLead">사진에서 안 보였어</p>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="stage">
      <button class="big" id="bigCard"></button>
      <div class="bag" id="bagIcon" aria-hidden="true">🎒</div>
    </div>
    <p class="tip">눈으로 보고, 가방에 넣었으면 눌러요</p>
    <div class="dock">
      <button class="cta" id="putIn">넣었어!</button>
      <button class="sub" id="notYet">아직 못 찾았어</button>
    </div>
  </section>

  <!-- C-3 결과 -->
  <section class="screen" id="s-done">
    <div class="head">
      <h1 id="doneTitle"></h1>
      <p class="lead" id="doneLead"></p>
    </div>
    <div class="grid" id="doneGrid"></div>
    <div class="note" id="parentNote"></div>
    <p class="tip">잘못 눌렀으면 카드를 눌러 <b>다시 빼기</b></p>
    <div class="dock">
      <button class="cta" id="report">엄마에게 보여 주기</button>
    </div>
  </section>

  <!-- 보고 완료 -->
  <section class="screen" id="s-sent">
    <div class="sent">
      <div class="sent-ic">📨</div>
      <h1>엄마한테 보냈어!</h1>
      <p class="lead" id="sentLead"></p>
    </div>
    <div class="dock">
      <a class="cta" href="/">부모 화면으로</a>
      <button class="sub" id="again">처음부터 다시</button>
    </div>
  </section>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>
<script src="/static/kid.js"></script>
</body>
</html>
